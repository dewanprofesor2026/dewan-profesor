<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Dewan Profesor Universitas Andalas
    </title>

    <!-- CSS UTAMA -->
    <link
        rel="stylesheet"
        href="style.css">


    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


    <!-- ==================================================
         HEADER
    =================================================== -->

    <header class="site-header">


        <!-- LOGO -->

        <img
            src="img/logo.png"
            class="logo"
            alt="Logo Dewan Profesor Universitas Andalas">


        <!-- JUDUL -->

        <h1>
            UNIVERSITAS ANDALAS
        </h1>


        <h2>
            DEWAN PROFESOR
        </h2>


        <p class="header-subtitle">
            Portal Digital Pengukuhan Guru Besar
        </p>



        <!-- ==================================================
             SLIDESHOW FOTO PROFESOR

             Hanya foto.
             Tidak ada nama profesor.

             Foto akan dimasukkan otomatis
             oleh script.js dari Google Sheets.
        =================================================== -->

        <div
            id="professorSlideshow"
            class="professor-slideshow">


            <!-- TOMBOL SEBELUMNYA -->

            <button
                type="button"
                class="slide-arrow slide-prev"
                id="slidePrev"
                aria-label="Profesor sebelumnya">

                <i class="fa-solid fa-chevron-left"></i>

            </button>



            <!-- AREA FOTO -->

            <div
                class="slideshow-track"
                id="slideshowTrack">

                <!--
                    FOTO PROFESOR AKAN DIBUAT
                    OTOMATIS OLEH JAVASCRIPT
                -->

            </div>



            <!-- TOMBOL BERIKUTNYA -->

            <button
                type="button"
                class="slide-arrow slide-next"
                id="slideNext"
                aria-label="Profesor berikutnya">

                <i class="fa-solid fa-chevron-right"></i>

            </button>


        </div>


    </header>



    <!-- ==================================================
         MENU UTAMA
    =================================================== -->

    <nav
        class="menu"
        id="mainMenu">


        <!-- BERANDA -->

        <button
            type="button"
            class="menu-btn active"
            id="btnBeranda">

            <i class="fa-solid fa-house"></i>

            <span>
                Beranda
            </span>

        </button>



        <!-- ARSIP -->

        <button
            type="button"
            class="menu-btn"
            id="btnArsip">

            <i class="fa-solid fa-folder-open"></i>

            <span>
                Arsip Pengukuhan
            </span>

        </button>



        <!-- SEARCH -->

        <div
            class="search-menu">


            <i
                class="fa-solid fa-magnifying-glass">
            </i>


            <input
                type="text"
                id="searchInput"
                placeholder="Cari Guru Besar..."
                autocomplete="off"
                aria-label="Cari Guru Besar">


        </div>


    </nav>



    <!-- ==================================================
         INFORMASI PERIODE TERBARU
    =================================================== -->

    <section
        class="periode-box"
        id="periodeBox">


        <h3>
            <i class="fa-regular fa-calendar-days"></i>
            Pengukuhan Guru Besar
        </h3>


        <h2 id="periodeAktif">
            25 Oktober 2026
        </h2>


        <p id="jumlahPeriode">
            7 Guru Besar Dikukuhkan
        </p>


    </section>



    <!-- ==================================================
         DAFTAR PROFESOR
         
         JavaScript akan mengisi bagian ini.
    =================================================== -->

    <main
        id="listProfesor"
        class="professor-list">

        <!-- DATA PROFESOR DARI GOOGLE SHEETS -->

    </main>



    <!-- ==================================================
         STATISTIK
    =================================================== -->

    <section
        class="statistics"
        id="statistics">


        <!-- TOTAL PROFESOR -->

        <div class="stat">


            <i
                class="fa-solid fa-user-graduate">
            </i>


            <span id="totalProfesor">
                0
            </span>


            <span>
                Guru Besar
            </span>


        </div>



        <!-- TOTAL BUKU -->

        <div class="stat">


            <i
                class="fa-solid fa-book-open">
            </i>


            <span id="totalBuku">
                0
            </span>


            <span>
                Buku Digital
            </span>


        </div>



        <!-- TOTAL VIDEO -->

        <div class="stat">


            <i
                class="fa-brands fa-youtube">
            </i>


            <span id="totalVideo">
                0
            </span>


            <span>
                Video
            </span>


        </div>


    </section>



    <!-- ==================================================
         FOOTER
    =================================================== -->

    <footer
        class="site-footer">


        <p>
            Direktorat Sumber Daya Manusia
        </p>


        <p>
            Universitas Andalas
        </p>


        <p>
            &copy;2026
        </p>


    </footer>



    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script
        src="script.js">
    </script>


</body>

</html>
