<!DOCTYPE html>
<html lang="id">

<head>

    <!-- =====================================================
         META
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#006b3c"
    >

    <title>
        Dewan Profesor Universitas Andalas
    </title>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================================
         BACKGROUND OVERLAY
         
         Background foto UNAND nanti diatur melalui CSS.
         JANGAN tambahkan <img> background di sini.
    ====================================================== -->

    <div class="background-overlay"></div>


    <!-- =====================================================
         CONTAINER UTAMA
    ====================================================== -->

    <div class="portal">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">


            <!-- LOGO HANYA SATU -->

            <img
                src="img/logo.png"
                class="logo"
                alt="Logo Universitas Andalas"
            >


            <!-- JUDUL -->

            <h1>
                UNIVERSITAS ANDALAS
            </h1>


            <h2>
                DEWAN PROFESOR
            </h2>


            <p class="subtitle">
                Portal Digital Pengukuhan Guru Besar
            </p>


            <!-- =================================================
                 SLIDESHOW FOTO PROFESOR
                 
                 JS akan mengisi bagian ini otomatis.
                 
                 Hanya foto + tidak ada nama.
            ================================================== -->

            <div
                id="professorSlideshow"
                class="professor-slideshow"
                aria-label="Slideshow Guru Besar"
            >

                <!--
                    Isi slideshow dibuat otomatis oleh script.js
                -->

            </div>


        </header>



        <!-- =================================================
             MENU UTAMA
        ================================================== -->

        <nav
            class="menu"
            aria-label="Menu utama"
        >


            <!-- BERANDA -->

            <button
                type="button"
                class="menu-btn active"
                id="btnBeranda"
            >

                <i class="fa-solid fa-house"></i>

                <span>
                    Beranda
                </span>

            </button>



            <!-- ARSIP -->

            <button
                type="button"
                class="menu-btn"
                id="btnArsip"
            >

                <i class="fa-solid fa-folder-open"></i>

                <span>
                    Arsip Pengukuhan
                </span>

            </button>



            <!-- SEARCH -->

            <div class="search-menu">

                <i
                    class="fa-solid fa-magnifying-glass"
                ></i>


                <input
                    type="search"
                    id="searchInput"
                    placeholder="Cari Guru Besar..."
                    autocomplete="off"
                    enterkeyhint="search"
                    aria-label="Cari Guru Besar"
                >

            </div>


        </nav>



        <!-- =================================================
             INFORMASI PERIODE TERBARU
        ================================================== -->

        <section
            class="periode-box"
            aria-label="Informasi periode pengukuhan"
        >


            <h3>
                <span aria-hidden="true">📅</span>
                Pengukuhan Guru Besar
            </h3>


            <h2 id="periodeAktif">
                Memuat data...
            </h2>


            <p id="jumlahPeriode">
                Memuat data Guru Besar...
            </p>


        </section>



        <!-- =================================================
             DAFTAR PROFESOR
             
             Script.js akan mengisi bagian ini.
        ================================================== -->

        <main
            id="listProfesor"
            class="list-profesor"
        >

            <div class="data-kosong">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <h3>
                    Memuat data...
                </h3>

                <p>
                    Mohon tunggu sebentar.
                </p>

            </div>

        </main>



        <!-- =================================================
             STATISTIK
        ================================================== -->

        <section
            class="statistics"
            aria-label="Statistik portal"
        >


            <!-- TOTAL GURU BESAR -->

            <div class="stat">

                <i
                    class="fa-solid fa-user-graduate"
                    aria-hidden="true"
                ></i>


                <span id="totalProfesor">
                    0
                </span>


                <small>
                    Guru Besar
                </small>

            </div>



            <!-- TOTAL BUKU -->

            <div class="stat">

                <i
                    class="fa-solid fa-book-open"
                    aria-hidden="true"
                ></i>


                <span id="totalBuku">
                    0
                </span>


                <small>
                    Buku Digital
                </small>

            </div>



            <!-- TOTAL VIDEO -->

            <div class="stat">

                <i
                    class="fa-brands fa-youtube"
                    aria-hidden="true"
                ></i>


                <span id="totalVideo">
                    0
                </span>


                <small>
                    Video
                </small>

            </div>


        </section>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="footer">


            <p>
                Direktorat Sumber Daya Manusia
            </p>


            <p>
                Universitas Andalas
            </p>


            <p class="copyright">
                &copy; 2026
            </p>


        </footer>


    </div>



    <!-- =====================================================
         JAVASCRIPT
         
         defer memastikan HTML selesai dibaca sebelum JS
         dijalankan.
    ====================================================== -->

    <script
        src="script.js"
        defer
    ></script>


</body>

</html>
