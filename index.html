<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dewan Profesor Universitas Andalas</title>

    <!-- CSS UTAMA -->
    <link rel="stylesheet" href="style.css">

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <img
            src="img/logo.png"
            class="logo"
            alt="Logo Dewan Profesor Universitas Andalas"
        >

        <h1>
            UNIVERSITAS ANDALAS
        </h1>

        <h2>
            DEWAN PROFESOR
        </h2>

        <p>
            Portal Digital Pengukuhan Guru Besar
        </p>

    </header>



    <!-- =====================================================
         SLIDESHOW PROFESOR
         
         FOTO AKAN DIISI OTOMATIS OLEH SCRIPT.JS
    ====================================================== -->

    <section
        class="professor-slideshow"
        id="professorSlideshow"
    >

        <!-- Tombol kiri -->

        <button
            class="slideshow-arrow slideshow-prev"
            id="slideshowPrev"
            type="button"
            aria-label="Profesor sebelumnya"
        >

            <i class="fa-solid fa-chevron-left"></i>

        </button>



        <!-- Area foto -->

        <div
            class="slideshow-track"
            id="slideshowTrack"
        >

            <!--
                Foto profesor akan dibuat
                otomatis oleh JavaScript.
            -->

        </div>



        <!-- Tombol kanan -->

        <button
            class="slideshow-arrow slideshow-next"
            id="slideshowNext"
            type="button"
            aria-label="Profesor berikutnya"
        >

            <i class="fa-solid fa-chevron-right"></i>

        </button>



        <!-- Indikator -->

        <div
            class="slideshow-dots"
            id="slideshowDots"
        >

            <!-- Dot dibuat otomatis oleh JavaScript -->

        </div>

    </section>



    <!-- =====================================================
         MENU UTAMA
    ====================================================== -->

    <nav class="menu">


        <!-- BERANDA -->

        <button
            class="menu-btn active"
            id="btnBeranda"
            type="button"
        >

            <i class="fa-solid fa-house"></i>

            <span>
                Beranda
            </span>

        </button>



        <!-- ARSIP -->

        <button
            class="menu-btn"
            id="btnArsip"
            type="button"
        >

            <i class="fa-solid fa-folder-open"></i>

            <span>
                Arsip Pengukuhan
            </span>

        </button>



        <!-- SEARCH -->

        <div class="search-menu">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Cari Guru Besar..."
                autocomplete="off"
                aria-label="Cari Guru Besar"
            >

        </div>

    </nav>



    <!-- =====================================================
         INFORMASI PERIODE TERBARU
    ====================================================== -->

    <section class="periode-box">


        <h3>
            <i class="fa-regular fa-calendar"></i>

            Pengukuhan Guru Besar
        </h3>


        <h2 id="periodeAktif">
            25 Oktober 2026
        </h2>


        <p id="jumlahPeriode">
            7 Guru Besar Dikukuhkan
        </p>


    </section>



    <!-- =====================================================
         DAFTAR PROFESOR
         
         Data akan dimasukkan oleh SCRIPT.JS
    ====================================================== -->

    <main id="listProfesor">

        <!--
            Kartu profesor akan dibuat
            otomatis oleh JavaScript.
        -->

    </main>



    <!-- =====================================================
         STATISTIK
    ====================================================== -->

    <section class="statistik">


        <!-- TOTAL PROFESOR -->

        <div class="stat">

            <i class="fa-solid fa-user-graduate"></i>

            <span id="totalProfesor">
                0
            </span>

            <span>
                Guru Besar
            </span>

        </div>



        <!-- TOTAL BUKU -->

        <div class="stat">

            <i class="fa-solid fa-book-open"></i>

            <span id="totalBuku">
                0
            </span>

            <span>
                Buku Digital
            </span>

        </div>



        <!-- TOTAL VIDEO -->

        <div class="stat">

            <i class="fa-brands fa-youtube"></i>

            <span id="totalVideo">
                0
            </span>

            <span>
                Video
            </span>

        </div>


    </section>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">


        <div class="footer-logo">

            <img
                src="img/logo.png"
                alt="Logo Dewan Profesor"
            >

        </div>


        <div class="footer-text">

            <h3>
                DEWAN PROFESOR
            </h3>

            <p>
                Direktorat Sumber Daya Manusia
            </p>

            <p>
                Universitas Andalas
            </p>

            <p>
                &copy; 2026
            </p>

        </div>


    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>


</body>

</html>
